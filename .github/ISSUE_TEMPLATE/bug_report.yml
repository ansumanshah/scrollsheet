name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Steps to reproduce, or a link to a minimal repro (StackBlitz, CodeSandbox, GitHub repo).
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and OS
      placeholder: e.g. Safari 18 / iOS 18.1, Chrome 130 / macOS 15
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: scrollsheet version
      placeholder: e.g. 1.0.0
    validations:
      required: true
