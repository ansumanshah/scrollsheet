name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default. The deploy job publishes through Cloudflare's own
# API token, so it needs no extra GitHub scopes beyond reading the artifact.
permissions:
  contents: read

# Supersede a PR's in-flight run when it gets another push. Never cancel a
# push-to-main run: that is the one that can be mid-deploy, which is also why
# the deploy job pins its own cancel-in-progress to false.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      # setup-bun caches only the bun BINARY, never the packages — without
      # this every job refetches the whole tree from npm on every run.
      - id: bun-cache-dir
        run: echo "path=$(bun pm cache)" >> "$GITHUB_OUTPUT"
      - name: Cache bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.bun-cache-dir.outputs.path }}
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      # docs/ is the other workspace and none of its deps are needed here;
      # --filter skips the docs site; typecheck and pack:check also cover the codemod.
      - run: bun install --frozen-lockfile --filter=scrollsheet --filter=scrollsheet-codemod
      - run: bun run typecheck
      - run: bun run check:compat
      - run: bun run check:deps
      - run: bun run check:registry
      # Build before test: tests/unit/use-client.test.ts guards the "use
      # client" banner by reading dist/*.mjs, which only exists post-build.
      - run: bun run build
      - run: bun run test
      - run: bun run size
      - run: bun run pack:check

  # The peer floor is react >=18, but bun.lock pins 19 and every other job
  # installs from it — so without this leg nothing would catch a regression
  # in the React 18 branch of internal/slot.tsx's ref reading. Under React 18
  # `props.ref` is a getter that always returns undefined, which breaks refs
  # silently at runtime rather than failing a typecheck.
  #
  # --no-save keeps the downgrade out of bun.lock, so the pinned 19 install
  # every other job depends on is untouched.
  react18:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - id: bun-cache-dir
        run: echo "path=$(bun pm cache)" >> "$GITHUB_OUTPUT"
      - name: Cache bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.bun-cache-dir.outputs.path }}
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      # Build while React 19 is still installed (the dts emit reads the
      # pinned @types/react); the dist/*.mjs files the use-client unit guard
      # reads are React-version-independent, so building pre-downgrade is
      # safe and keeps that test runnable here.
      - run: bun run build
      - run: bun add --no-save react@18 react-dom@18 @types/react@18 @types/react-dom@18
      - name: Confirm the downgrade actually took
        run: |
          version=$(bun --print "require('react/package.json').version")
          echo "react in node_modules: $version"
          case "$version" in
            18.*) ;;
            *) echo "expected React 18, got $version"; exit 1 ;;
          esac
      - run: bun run test

  # One job per Playwright project so webkit/firefox run alongside chromium
  # instead of after it. The CI worker count lives in playwright.config.ts, so
  # matrix jobs can't lower the per-project floor, but they do parallelize the
  # projects against
  # each other across separate GitHub-hosted runners instead of summing them
  # in one job, and each job now installs only the one browser engine it
  # needs. tests/e2e/fixtures/ bundles straight from ../../src (see serve.ts),
  # never the built package, so this job does not need `bun run build` first.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium-mobile
            browser: chromium
          - project: chromium-desktop
            browser: chromium
          - project: webkit-mobile
            browser: webkit
          - project: firefox-desktop
            browser: firefox
          - project: perf
            browser: chromium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - id: bun-cache-dir
        run: echo "path=$(bun pm cache)" >> "$GITHUB_OUTPUT"
      - name: Cache bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.bun-cache-dir.outputs.path }}
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile --filter=scrollsheet
      - name: Cache Playwright browser binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          # --with-deps still runs every time (it also installs OS-level apt
          # packages, which this cache does not cover) but it skips
          # redownloading a browser binary that's already present at the
          # version this key resolves to.
          key: ${{ runner.os }}-playwright-${{ matrix.browser }}-${{ hashFiles('bun.lock') }}
          # A lockfile bump that does not move playwright still invalidates the
          # exact key; the prefix restores the old binaries so `playwright
          # install` re-downloads only what actually changed.
          restore-keys: ${{ runner.os }}-playwright-${{ matrix.browser }}-
      - run: bunx playwright install --with-deps ${{ matrix.browser }}
      - run: bun run test:e2e -- --project=${{ matrix.project }}

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - id: bun-cache-dir
        run: echo "path=$(bun pm cache)" >> "$GITHUB_OUTPUT"
      - name: Cache bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.bun-cache-dir.outputs.path }}
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      # No --filter here: this is the one job that needs both workspaces.
      # Build first, because the site aliases scrollsheet/styles.css straight
      # to packages/scrollsheet/dist, so it has to exist before the site builds.
      - run: bun run build
      - run: bun run --cwd docs typecheck
      - run: bun run --cwd docs build
      - name: Cache Playwright browser binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-playwright-chromium-
      - run: bunx playwright install --with-deps chromium
      - run: bunx playwright test -c playwright.site.config.ts
      # Only needed on the branch the deploy job actually publishes from —
      # skip it on PRs so forked/branch runs don't spend time uploading an
      # artifact nothing will consume. docs/astro.config.mjs has no `base`,
      # so this is the root-relative build the deploy job expects.
      - name: Upload site artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-dist
          path: docs/dist
          retention-days: 1

  # Publishes docs/dist (built and smoke-tested by the `docs` job above) to
  # Cloudflare Pages, project `scrollsheet`, serving scrollsheet.dev.
  #
  # Direct upload rather than Cloudflare's own Git integration: that
  # integration needs the Cloudflare GitHub App authorised against this repo
  # through the dashboard, and it would rebuild the site on Cloudflare's
  # runners with none of the gates below. Uploading the artifact this
  # workflow already built and smoke-tested keeps one build and one set of
  # tests in front of everything that ships.
  #
  # Gated on push-to-main (excludes pull_request entirely, including from
  # forks) and on running in this repo rather than a fork's own copy.
  deploy:
    # check + docs only: the full e2e matrix still runs and reds the commit,
    # but the docs deploy doesn't wait ~8 minutes for it. `check` (typecheck,
    # unit, build) catches src breakage the aliased site would inherit; `docs`
    # builds the artifact being deployed.
    needs: [check, docs]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'ansumanshah/scrollsheet'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: production
      url: https://scrollsheet.dev
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-dist
          path: docs/dist
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/dist --project-name=scrollsheet --branch=main
