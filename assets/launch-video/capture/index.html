<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>scrollsheet launch capture</title>
    <style>
      :root {
        --ink: #0c0b0a;
        --muted: #6b6862;
        --line: #e7e4de;
        --violet: #534ab7;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #ece9e2;
        color: var(--ink);
      }
      button,
      input {
        font: inherit;
        color: inherit;
      }
      .page {
        position: fixed;
        inset: 0;
      }
      .map {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .trigger {
        position: absolute;
        left: 50%;
        bottom: 44px;
        translate: -50% 0;
        height: 60px;
        padding: 0 34px;
        border: 0;
        border-radius: 30px;
        background: var(--ink);
        color: #fff;
        font-size: 19px;
        font-weight: 600;
        box-shadow: 0 10px 30px -10px rgb(12 11 10 / 0.5);
      }
      .panel {
        --scrollsheet-radius: 26px;
        --scrollsheet-bg: #fff;
        --scrollsheet-backdrop: rgb(12 11 10 / 0.42);
        color: var(--ink);
      }
      .body {
        padding: 6px 22px 28px;
      }
      .title {
        margin: 6px 0 0;
        font-size: 28px;
        line-height: 1.15;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .desc {
        margin: 4px 0 16px;
        font-size: 17px;
        color: var(--muted);
      }
      .search {
        box-sizing: border-box;
        width: 100%;
        height: 50px;
        margin-bottom: 8px;
        padding: 0 16px;
        border: 0;
        border-radius: 14px;
        background: #f2f1ee;
        font-size: 18px;
        outline: none;
      }
      .search:focus {
        box-shadow: inset 0 0 0 2px var(--violet);
        background: #fff;
      }
      .search::placeholder {
        color: var(--muted);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 13px 0;
        border-bottom: 1px solid var(--line);
      }
      .row:last-child {
        border-bottom: 0;
      }
      .swatch {
        flex: none;
        width: 46px;
        height: 46px;
        border-radius: 13px;
      }
      .row-text {
        flex: 1;
        min-width: 0;
        display: grid;
        gap: 2px;
      }
      .row-name {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .row-meta,
      .row-miles {
        font-size: 15px;
        color: var(--muted);
      }
      .save {
        height: 38px;
        padding: 0 16px;
        border: 0;
        border-radius: 19px;
        background: #efecff;
        color: var(--violet);
        font-size: 15px;
        font-weight: 600;
      }
      .card {
        position: absolute;
        left: 12px;
        right: 12px;
        top: 150px;
        padding: 6px 18px;
        border-radius: 24px;
        background: #fff;
        box-shadow: 0 16px 40px -14px rgb(12 11 10 / 0.4);
      }
      .toolbar {
        position: absolute;
        top: 28px;
        left: 28px;
        display: flex;
        gap: 12px;
      }
      .tool {
        height: 52px;
        padding: 0 26px;
        border: 0;
        border-radius: 26px;
        background: #fff;
        font-size: 18px;
        font-weight: 600;
        box-shadow: 0 8px 24px -8px rgb(12 11 10 / 0.3);
      }
      .tool-accent {
        background: var(--violet);
        color: #fff;
      }
      .side-panel .body {
        padding: 34px 28px;
      }
      .toggle-row {
        display: flex;
        width: 100%;
        align-items: center;
        justify-content: space-between;
        padding: 16px 0;
        border: 0;
        border-bottom: 1px solid var(--line);
        background: none;
        font-size: 18px;
        font-weight: 500;
      }
      .toggle {
        position: relative;
        width: 50px;
        height: 30px;
        border-radius: 15px;
        background: #d4d0c8;
      }
      .toggle::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: #fff;
        transition: translate 420ms var(--toggle-spring, ease-out);
      }
      .toggle.on {
        background: var(--violet);
      }
      .toggle.on::after {
        translate: 20px 0;
      }
      .primary,
      .secondary {
        height: 52px;
        padding: 0 24px;
        border: 0;
        border-radius: 15px;
        font-size: 18px;
        font-weight: 600;
      }
      .primary {
        background: var(--violet);
        color: #fff;
      }
      .secondary {
        background: #f2f1ee;
      }
      .side-panel .primary {
        width: 100%;
        margin-top: 26px;
      }
      .actions {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        margin-top: 12px;
      }
      .dialog-panel {
        width: min(480px, 100vw);
        --scrollsheet-radius: 22px;
      }
      .scrollsheet-toast,
      [data-sonner-toast] {
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
